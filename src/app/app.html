<main style="padding: 2rem; font-family: sans-serif;">
  <h1>{{ title }}</h1>

  <section style="margin-top: 2rem; padding: 1rem; border: 1px solid #ccc;">
    <h2>Respuesta del Backend:</h2>

    @if (profileData) {
      <pre style="background: #f4f4f4; padding: 1rem; border-radius: 5px;">{{ profileData | json }}</pre>
    } @else {
      <p style="color: #666; font-style: italic;">
        Intentando conectar con el backend (http://localhost:8000/api/profile)...
      </p>
    }
  </section>

  <router-outlet></router-outlet>
</main>
